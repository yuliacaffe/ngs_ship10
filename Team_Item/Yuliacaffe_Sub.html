<style>

<script>
/* =========================================================
   メインタブ：URL hashで初期表示。履歴APIは使用しない
   ========================================================= */
const MAIN_PAGES = ['member','spreadsheet','team-movie','yulia-movie','roulette'];

function switchMainPage(page, button, updateHash=true){
  if(!MAIN_PAGES.includes(page)) page='member';
  document.querySelectorAll('.page-section').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelectorAll('.main-tabs button').forEach(x=>x.classList.remove('active'));
  const activeButton = button || document.querySelector(`.main-tabs button[data-page="${page}"]`);
  activeButton?.classList.add('active');
  if(updateHash) location.hash = page;
}
function initMainPage(){
  const hash=(location.hash||'').replace(/^#/,'');
  switchMainPage(MAIN_PAGES.includes(hash)?hash:'member',null,false);
}
window.addEventListener('load',initMainPage);

/* =========================================================
   メンバー一覧
   元ページの公開HTML/JSON取得方式を維持
   ========================================================= */
let memberRadarChart=null, memberTableData=[], memberData={};
const memberCurrentYear=new Date().getFullYear();

async function initMemberData(){
  try{
    const tableRes=await fetch('https://yuliacaffe.github.io/ngs_ship10/Team_Item/TeamMemberList.html');
    const tableText=await tableRes.text();
    const doc=new DOMParser().parseFromString(tableText,'text/html');
    const table=doc.querySelector('table');
    if(table){
      const rows=table.querySelectorAll('tr');
      if(rows.length){
        const headers=Array.from(rows[0].querySelectorAll('th,td')).map(x=>x.textContent.trim());
        memberTableData=Array.from(rows).slice(1).map(row=>{
          const cells=Array.from(row.querySelectorAll('td')).map(x=>x.textContent.trim());
          return Object.fromEntries(headers.map((h,i)=>[h,cells[i]||'']));
        });
      }
    }
    const memberRes=await fetch('https://yuliacaffe.github.io/ngs_ship10/Team_Item/TeamMemberJson/members.json');
    memberData=await memberRes.json();
    buildMemberTabs();
    showMemberDescription();
  }catch(e){
    document.getElementById('owninfo').innerHTML='<b>メンバー情報の取得に失敗しました。</b><br>公開データの読み込み状態をご確認ください。';
  }
}
function createMemberButton(text,fn,cls=''){
  const b=document.createElement('button'); b.type='button'; b.textContent=text; b.className=cls; b.onclick=fn; return b;
}
function createNameButton(name,info,isMember=false){
  const b=createMemberButton(name,()=>displayMemberProfile(info,name),'name-button name');
  if(isMember)b.style.marginLeft='8px';
  return b;
}
function appendMembers(container,members,role){
  members.filter(([,info])=>info.post===role).forEach(([name,info])=>container.appendChild(createNameButton(name,info)));
}
function buildMemberTabs(){
  const top=document.getElementById('topTabs'), second=document.getElementById('secondTabs'), third=document.getElementById('thirdTabs');
  top.innerHTML=''; second.innerHTML=''; third.innerHTML='';
  const roleMap={'Master':'マスター','Sub Master':'サブマスター','Manager':'マネージャー'};
  ['説明','Master','Sub Master','Manager','Member'].forEach(tabName=>{
    const b=createMemberButton(tabName,()=>{
      top.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
      second.innerHTML=''; third.innerHTML='';
      if(tabName==='説明'){showMemberDescription();return;}
      if(roleMap[tabName]){appendMembers(second,Object.entries(memberData),roleMap[tabName]);return;}
      for(let year=2013;year<=memberCurrentYear;year++){
        const yearMembers=Object.entries(memberData).filter(([,info])=>
          info.post!=='マスター'&&info.post!=='サブマスター'&&info.post!=='マネージャー'&&info.join===String(year));
        if(!yearMembers.length)continue;
        const yb=createMemberButton(year,()=>{
          second.querySelectorAll('button').forEach(x=>x.classList.remove('active'));yb.classList.add('active');
          third.innerHTML='';yearMembers.forEach(([name,info])=>third.appendChild(createNameButton(name,info,true)));
        },'year');
        second.appendChild(yb);
      }
    },'role');
    top.appendChild(b);
  });
  top.querySelector('button')?.classList.add('active');
}
function showMemberDescription(){
  document.getElementById('owninfo').innerHTML=`
    <div style="text-align:center;font-weight:bold;font-size:20px;margin-bottom:6px;">☕ チームメンバー一覧♬へ、ようこそ!!。</div><br>
    上部タブから役職区分(Master, Sub Master, Manager, Member)を選択してください♬。<br>
    Memberは加入年を選択すると、該当するメンバーさんを表示します♬。<br><br>
    メンバー名を選択すると、プロフィール・基本詳細・ステータスが表示されます。<br><br>
    ※組の勢力割合!?については、<a href="https://yuliacaffe.github.io/ngs_ship10/Team_Item/TeamMemberList.html" target="_blank" rel="noopener noreferrer">旧チームメンバー一覧ページ</a>をご参照♬。
  `;
  document.getElementById('profileInfo').innerHTML='';
  document.getElementById('photo').style.display='none';
  document.getElementById('xurl').removeAttribute('href');
  document.getElementById('xurl').textContent='X（旧Twitter）';
  document.getElementById('chartInfo').style.display='none';
}
function displayMemberProfile(info,name){
  document.getElementById('profilename')?.remove();
  const profile=document.getElementById('profileInfo');
  const own=document.getElementById('owninfo');
  profile.innerHTML=`<div style="text-align:center;font-weight:bold;font-size:20px;margin-bottom:6px;">☕お名前：${escapeHtml(name)}</div><br>`+
    (()=>{const m=memberTableData.find(x=>x.Name===name);return m?`◇Join Date: ${escapeHtml(m['Join Date']||'')}<br>◇Class: ${escapeHtml(m['Class']||'')}<br>◇Ship: ${escapeHtml(m['Ship']||'')}<br>`:''})();
  own.innerHTML='<div style="text-align:center;font-weight:bold;font-size:20px;margin-bottom:6px;">～ 自己紹介 ～</div><br>'+(info.info||'').replace(/\\n/g,'<br>');
  const photo=document.getElementById('photo');
  if(info.photo){photo.src=info.photo;photo.style.display='inline-block'}else{photo.style.display='none'}
  const xurl=document.getElementById('xurl');
  if(info.x){xurl.href=info.x;xurl.textContent='X（旧Twitter）'}else{xurl.removeAttribute('href');xurl.textContent='X（旧Twitter）'}
  document.getElementById('chartInfo').style.display='block';
  initMemberRadar(info);
}
function initMemberRadar(info){
  const canvas=document.getElementById('radarChart');
  if(memberRadarChart)memberRadarChart.destroy();
  memberRadarChart=new Chart(canvas.getContext('2d'),{
    type:'radar',
    data:{labels:['クエスト','CS','LS','交流','ファッション'],datasets:[{
      label:'プレイスタイル',
      data:[info.radar_quest,info.radar_cs,info.radar_ls,info.radar_commu,info.radar_fashion].map(v=>Number(v||0)),
      backgroundColor:'rgba(100,180,100,.3)',borderColor:'#4caf50',borderWidth:2,pointBackgroundColor:'#4caf50'
    }]},
    options:{responsive:true,maintainAspectRatio:true,scale:{ticks:{beginAtZero:true,max:5,stepSize:1}}}
  });
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* =========================================================
   動画ページ
   ========================================================= */
const MOVIE_URL='https://yuliacaffe.github.io/ngs_ship10/Team_Item/TeamMovieJson/movie.json';
const PSO2_HERO='https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/127612/197f13bbeae4948724dfa61dd803c99c_f2791f968494a6325977992341f6ecda.jpg';
const NGS_HERO='https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/127612/ec1dfdfac9f221fe3f8ecd1fb2fefcbd_5b8fe48d46e7b9db40c14a89fb1dda5c.jpg';

async function initMoviePage(kind,types,tabsId,contentId,heroId){
  try{
    const data=await (await fetch(MOVIE_URL)).json();
    const list=[];
    types.forEach(type=>list.push({type,rows:data.filter(x=>x.type===type)}));
    const tabs=document.getElementById(tabsId), content=document.getElementById(contentId);
    tabs.innerHTML='';content.innerHTML='';
    let tabNo=1;
    list.forEach(group=>{
      const rows=group.rows;
      for(let i=0;i<rows.length;i+=50){
        const chunk=rows.slice(i,i+50), id=`${kind}-tab-${tabNo}`;
        const label=(group.type===1||group.type===3?'PSO2':'NGS')+'_'+(Math.floor(i/50)+1);
        const b=document.createElement('button');b.type='button';b.textContent=label;b.className=tabNo===1?'active':'';
        b.onclick=()=>showMovieTab(id,b,kind,heroId);
        tabs.appendChild(b);
        const div=document.createElement('div');div.id=id;div.className='movie-content'+(tabNo===1?' active':'');
        const table=document.createElement('table');table.className='movie-table';
        let head='';
        if(group.type===1)head='<tr><th>No</th><th>Mission</th><th>Release</th><th>Videographer</th><th>Detail</th><th>Link</th></tr>';
        if(group.type===2)head='<tr><th>No</th><th>Mission</th><th>Rank</th><th>Time</th><th>Release</th><th>Videographer</th><th>Detail</th><th>Link</th></tr>';
        if(group.type===3)head='<tr><th>No</th><th>Mission</th><th>Release</th><th>Time</th><th>Class</th><th>Link</th></tr>';
        if(group.type===4)head='<tr><th>No</th><th>Mission</th><th>Rank</th><th>Time</th><th>Release</th><th>Class</th><th>Link</th></tr>';
        table.innerHTML='<thead>'+head+'</thead>';
        const tbody=document.createElement('tbody');
        chunk.forEach((x,j)=>{
          const tr=document.createElement('tr');
          const n=i+j+1;
          const val=(obj,...keys)=>{for(const k of keys){if(obj[k]!==undefined&&obj[k]!==null)return obj[k]}return ''};
          let cells=[];
          if(group.type===1)cells=[n,val(x,'mission','Mission'),val(x,'release','Release'),val(x,'videographer','Videographer'),val(x,'detail','Detail')];
          if(group.type===2)cells=[n,val(x,'mission','Mission'),val(x,'rank','Rank'),val(x,'time','Time'),val(x,'release','Release'),val(x,'videographer','Videographer'),val(x,'detail','Detail')];
          if(group.type===3)cells=[n,val(x,'mission','Mission'),val(x,'release','Release'),val(x,'time','Time'),val(x,'class','Class')];
          if(group.type===4)cells=[n,val(x,'mission','Mission'),val(x,'rank','Rank'),val(x,'time','Time'),val(x,'release','Release'),val(x,'class','Class')];
          cells.forEach(v=>{const td=document.createElement('td');td.textContent=v??'';tr.appendChild(td)});
          const td=document.createElement('td');const a=document.createElement('a');a.href=x.link||x.url||'#';a.target='_blank';a.rel='noopener noreferrer';a.textContent='OPEN';td.appendChild(a);tr.appendChild(td);tbody.appendChild(tr);
        });
        table.appendChild(tbody);div.appendChild(table);content.appendChild(div);tabNo++;
      }
    });
  }catch(e){
    document.getElementById(contentId).innerHTML='<div class="card">動画データを取得できませんでした。</div>';
  }
}
function showMovieTab(id,button,kind,heroId){
  const root=button.closest('.card');
  root.querySelectorAll('.movie-content').forEach(x=>x.classList.remove('active'));
  root.querySelectorAll('.movie-tabs button').forEach(x=>x.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');button.classList.add('active');
  const label=button.textContent||'';
  document.getElementById(heroId).src=label.startsWith('PSO2')?PSO2_HERO:NGS_HERO;
}

  const p=document.getElementById('sheetPassword').value;
  const err=document.getElementById('sheetError'),link=document.getElementById('sheetLink');
  err.textContent='';link.textContent='';
  if(p.length!==6||/[=&?%]/.test(p)){err.textContent='パスワードが間違っています。';return}
  const [one,two,thr,fou,fiv,six]=p.split('');
  const generatedURL=`h${six}${six}ps://docs.google.com/spreadshee${six}s/d/1${fou}NmOI${six}4sQtHlu4BU${one}8${two}XgI5qZC${fiv}uoEqH${six}${thr}wNBjyN1hI/view?usp=sharing`;
  const a=document.createElement('a');a.href=generatedURL;a.target='_blank';a.rel='noopener noreferrer';a.textContent='チームのスプレッドシートを開く♬';

}
function resetSpreadsheet(){document.getElementById('sheetPassword').value='';document.getElementById('sheetError').textContent='';document.getElementById('sheetLink').innerHTML=''}

/* =========================================================
   ルーレット＆パーティー
   ========================================================= */
let rouletteTimers=[null,null,null,null],rouletteIndex=0;
function showRouletteMode(mode,button){
  document.querySelectorAll('#page-roulette .roulette-mode').forEach(x=>x.classList.remove('active'));
  document.getElementById(mode+'-mode').classList.add('active');
  document.querySelectorAll('#page-roulette .mode-tabs button').forEach(x=>x.classList.remove('active'));
  button.classList.add('active');
}
function buildRouletteTables(names){
  const r=document.getElementById('rouletteTables'),p=document.getElementById('partyTables');
  r.innerHTML='';p.innerHTML='';
  for(let t=1;t<=6;t++){
    const rt=document.createElement('table');rt.className='roulette-table';rt.id='roulette-table-'+t;
    rt.innerHTML='<tbody><tr><th>お名前</th>'+Array.from({length:16},()=>'<th></th>').join('')+'</tr><tr><td><b>参加有無</b></td>'+Array.from({length:16},(_,i)=>`<td><input type="checkbox" name="rouletteMember" value="${escapeHtml(names[i]||'')}"></td>`).join('')+'</tr></tbody>';
    r.appendChild(rt);
    const pt=document.createElement('table');pt.className='roulette-table';pt.id='party-table-'+t;
    pt.innerHTML='<tbody><tr><th>お名前</th>'+Array.from({length:16},()=>'<th></th>').join('')+'</tr><tr><td><b>参加：「〇」<br>不参加：「－」</b></td>'+Array.from({length:16},(_,i)=>`<td><select name="partyMember"><option value="N">－</option><option value="${escapeHtml(names[i]||'')}">〇</option></select></td>`).join('')+'</tr></tbody>';
    p.appendChild(pt);
  }
}
async function initRouletteData(){
  try{
    const text=await (await fetch('https://yuliacaffe.github.io/ngs_ship10/Team_Item/TeamMemberList.html')).then(r=>r.text());
    const doc=new DOMParser().parseFromString(text,'text/html'),table=doc.querySelector('table');
    const names=table?[...table.querySelectorAll('tr')].slice(1).map(row=>row.querySelector('td')?.textContent.trim()).filter(Boolean):[];
    buildRouletteTables(names);
  }catch(e){buildRouletteTables([])}
}
function selectedRouletteNames(){
  const all=[...document.querySelectorAll('#rouletteTables input[name="rouletteMember"]:checked')];
  return [...new Set(all.map(x=>x.value).filter(Boolean))].slice(0,16);
}
function stopRoulette(n){if(rouletteTimers[n]){clearInterval(rouletteTimers[n]);rouletteTimers[n]=null}}
function resetRoulette(){
  document.querySelectorAll('#rouletteTables input[name="rouletteMember"]').forEach(x=>x.checked=false);
  [0,1,2,3].forEach(i=>{stopRoulette(i);document.getElementById('lule'+i).textContent='????'})
}
function startRoulette(){
  const names=selectedRouletteNames();
  if(!names.length){alert('メンバーが1人も選択されておりません。1人以上を選択くだちぃぃぃ♪。');return}
  if(names.length>16){alert('17人以上が選択されています。16人以下で選択してくだちぃぃぃ♪。');return}
  [0,1,2,3].forEach(stopRoulette);
  const count=names.length<=4?1:names.length<=8?2:names.length<=12?3:4;
  for(let n=0;n<4;n++)document.getElementById('lule'+n).textContent=n<count?'????':'????';
  for(let n=0;n<count;n++){
    let idx=Math.floor(Math.random()*names.length);
    rouletteTimers[n]=setInterval(()=>{document.getElementById('lule'+n).textContent=names[idx++%names.length]},35);
  }
}
function runParty(){
  let names=[];
  document.querySelectorAll('#partyTables select[name="partyMember"]').forEach(s=>{if(s.value!=='N'&&s.value)names.push(s.value)});
  names=[...new Set(names)];
  if(!names.length){alert('1人も「〇」が選択されていません。1人以上を選択してくだちぃ～♪。');return}
  for(let i=names.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]]}
  const out=new Array(16).fill(' ');
  names.forEach((n,i)=>out[i]=n);
  if(names.length===5)[out[5],out[3]]=[out[3],out[5]];
  if(names.length===6)[out[6],out[3]]=[out[3],out[6]];
  if(names.length===9){[out[9],out[3]]=[out[3],out[9]];[out[10],out[7]]=[out[7],out[10]]}
  if(names.length===10)[out[10],out[7]]=[out[7],out[10]];
  if(names.length===13){[out[13],out[7]]=[out[7],out[13]];[out[14],out[11]]=[out[11],out[14]]}
  if(names.length===14)[out[14],out[11]]=[out[11],out[14]];
  const body=document.getElementById('partyOutputBody');body.innerHTML='';
  for(let g=0;g<4;g++){
    const tr=document.createElement('tr');tr.innerHTML=`<th>${g+1}</th>`;
    for(let j=0;j<4;j++){const td=document.createElement('td'),inp=document.createElement('input');inp.value=out[g*4+j]||'';inp.readOnly=true;td.appendChild(inp);tr.appendChild(td)}
    body.appendChild(tr);
  }
}
function resetParty(){
  document.querySelectorAll('#partyTables select[name="partyMember"]').forEach(x=>x.value='N');
  document.getElementById('partyOutputBody').innerHTML='';
}
document.getElementById('rouletteStart').onclick=startRoulette;
document.getElementById('rouletteReset').onclick=resetRoulette;
[0,1,2,3].forEach(n=>document.getElementById('stop'+n).onclick=()=>stopRoulette(n));
document.getElementById('partyRun').onclick=runParty;
document.getElementById('partyReset').onclick=resetParty;

  await initMoviePage('yulia',[3,4],'yuliaMovieTabs','yuliaMovieContent','yuliaMovieHero');

});
